name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "2"
  # GoodLookinDri c9773b6: 0.2 lit rendering.
  GOODLOOKINDRI_REF: c9773b6a44cf5bf9b4b3c207d51a2db5fb464ae1
  # AudioUnitSDK-1.4.0.
  AUDIOUNITSDK_REF: bd98b31feff57a15989fcfab4cd86dc63382b1ac
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Workspace tests (stable)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out OpenPluginSDK
        uses: actions/checkout@v4
        with:
          path: OpenPluginSDK
      # The SDK has a path dependency on ../GoodLookinDri. Pinned, so a push to
      # GoodLookinDri cannot change this build; move the pin in the same commit
      # that adapts the SDK to a newer GoodLookinDri.
      - name: Check out GoodLookinDri as a sibling
        uses: actions/checkout@v4
        with:
          repository: MistaMin/GoodLookinDri
          ref: ${{ env.GOODLOOKINDRI_REF }}
          path: GoodLookinDri
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run the workspace tests
        working-directory: OpenPluginSDK
        run: cargo test --workspace
      # The C++ bridge's fault tests need a test-only feature (an operator new that
      # reports to Rust's allocator), so the workspace run above skips them.
      - name: C++ bridge fault tests
        working-directory: OpenPluginSDK
        run: cargo test -p example-cpp-bridge --features test-faults
      - name: Clippy, warnings as errors
        working-directory: OpenPluginSDK
        run: cargo clippy --workspace --all-targets -- -D warnings

  # The core and DSP crates are platform-independent Rust. GitHub's Linux and
  # Windows runners are x86_64 servers, so this job also runs the SSE2 and
  # AVX+FMA kernels in openplugin_dsp::simd on real x86 hardware, which no Mac
  # here can (Rosetta reports no AVX). It is the first step of the Windows and
  # Linux roadmap (W1: build and test the Rust side everywhere).
  x86-core-dsp:
    name: Core and DSP tests on x86_64 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out OpenPluginSDK
        uses: actions/checkout@v4
        with:
          path: OpenPluginSDK
      - name: Check out GoodLookinDri as a sibling
        uses: actions/checkout@v4
        with:
          repository: MistaMin/GoodLookinDri
          ref: ${{ env.GOODLOOKINDRI_REF }}
          path: GoodLookinDri
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Report the CPU's vector features
        shell: bash
        run: |
          if [ -r /proc/cpuinfo ]; then
            grep -m1 "model name" /proc/cpuinfo
            grep -o -w 'sse2\|avx\|avx2\|fma' /proc/cpuinfo | sort -u | tr '\n' ' '; echo
          else
            powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name"
          fi
      - name: Core and DSP tests
        working-directory: OpenPluginSDK
        run: cargo test -p openplugin-core -p openplugin-dsp
      - name: SIMD kernels in release, with the speed-up report
        working-directory: OpenPluginSDK
        run: cargo test -p openplugin-dsp --release --lib simd -- --include-ignored --nocapture

  msrv:
    name: MSRV check (Rust 1.85.0)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out OpenPluginSDK
        uses: actions/checkout@v4
        with:
          path: OpenPluginSDK
      # The SDK has a path dependency on ../GoodLookinDri. Pinned, so a push to
      # GoodLookinDri cannot change this build; move the pin in the same commit
      # that adapts the SDK to a newer GoodLookinDri.
      - name: Check out GoodLookinDri as a sibling
        uses: actions/checkout@v4
        with:
          repository: MistaMin/GoodLookinDri
          ref: ${{ env.GOODLOOKINDRI_REF }}
          path: GoodLookinDri
      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@1.85.0
      - name: Check the workspace on the minimum Rust version
        working-directory: OpenPluginSDK
        run: cargo +1.85.0 check --workspace --all-targets --locked

  clap-validator:
    name: CLAP validator (examples/editor)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # clap-validator 0.4.1 (build 127-g152b982), the release the local
      # checks use. The zip holds a tar.gz with the single `clap-validator`
      # binary. The checksum is the SHA-256 of the zip, from the release page.
      CLAP_VALIDATOR_URL: https://github.com/free-audio/clap-validator/releases/download/0.4.1/clap-validator-0.4.1-127-g152b982-macos-15-aarch64.zip
      CLAP_VALIDATOR_SHA256: 719a0248ea431718bb7c92c8a0b9a78afa0bb23d692cf452e80973fe8b89282d
    steps:
      - name: Check out OpenPluginSDK
        uses: actions/checkout@v4
        with:
          path: OpenPluginSDK
      # The SDK has a path dependency on ../GoodLookinDri. Pinned, so a push to
      # GoodLookinDri cannot change this build; move the pin in the same commit
      # that adapts the SDK to a newer GoodLookinDri.
      - name: Check out GoodLookinDri as a sibling
        uses: actions/checkout@v4
        with:
          repository: MistaMin/GoodLookinDri
          ref: ${{ env.GOODLOOKINDRI_REF }}
          path: GoodLookinDri
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      # Nothing from the download runs unless the checksum matches.
      - name: Download clap-validator and verify its checksum
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clap-validator"
          cd "$RUNNER_TEMP/clap-validator"
          curl --fail --silent --show-error --location --output clap-validator.zip "$CLAP_VALIDATOR_URL"
          echo "$CLAP_VALIDATOR_SHA256  clap-validator.zip" | shasum -a 256 -c -
          unzip -q clap-validator.zip
          tar -xzf clap-validator-*.tar.gz clap-validator
          chmod +x clap-validator
          ./clap-validator --version
      - name: Build examples/editor
        working-directory: OpenPluginSDK
        run: cargo build --release -p example-editor
      - name: Bundle the example as a .clap
        working-directory: OpenPluginSDK
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/bundle/Editor.clap"
          rm -rf "$RUNNER_TEMP/bundle"
          mkdir -p "$bundle/Contents/MacOS"
          cp target/release/libexample_editor.dylib "$bundle/Contents/MacOS/Editor"
          cat > "$bundle/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>Editor</string>
            <key>CFBundleIdentifier</key>
            <string>com.opengrid.example.editor</string>
            <key>CFBundleName</key>
            <string>Editor</string>
            <key>CFBundlePackageType</key>
            <string>BNDL</string>
            <key>CFBundleVersion</key>
            <string>1</string>
          </dict>
          </plist>
          PLIST
          codesign --force --sign - "$bundle"
          codesign --verify --verbose "$bundle"
      # clap-validator exits non-zero when any test fails.
      - name: Validate the bundle
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/clap-validator/clap-validator" validate "$RUNNER_TEMP/bundle/Editor.clap"

  vst3-shell:
    name: VST3 shell proofs
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # VST3 SDK v3.8.0_build_66 (MIT). Pinned by tag, with its submodules.
      VST3_SDK_REF: v3.8.0_build_66
    steps:
      - name: Check out OpenPluginSDK
        uses: actions/checkout@v4
        with:
          path: OpenPluginSDK
      # The SDK has a path dependency on ../GoodLookinDri. Pinned, so a push to
      # GoodLookinDri cannot change this build; move the pin in the same commit
      # that adapts the SDK to a newer GoodLookinDri.
      - name: Check out GoodLookinDri as a sibling
        uses: actions/checkout@v4
        with:
          repository: MistaMin/GoodLookinDri
          ref: ${{ env.GOODLOOKINDRI_REF }}
          path: GoodLookinDri
      - name: Check out the public VST3 SDK
        uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          ref: ${{ env.VST3_SDK_REF }}
          submodules: recursive
          path: vst3sdk
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      # The proofs load the SDK example (examples/editor, "Example Gain"); the role proof
      # (vst3_roles_proof) loads Role Tags (examples/role_tags), found next to it.
      - name: Build the example and Role Tags as static libraries
        working-directory: OpenPluginSDK
        run: cargo build --release --lib -p example-editor -p example-role-tags
      # Only the VST3 shell: no Audio Unit or AAX SDK, no editor.
      - name: Configure the VST3 shell
        working-directory: OpenPluginSDK
        run: |
          cmake -S native -B build-shell -DCMAKE_BUILD_TYPE=Release \
            -DOP_RUST_LIB="$PWD/target/release/libexample_editor.a" \
            -DOP_VST3_SDK="$GITHUB_WORKSPACE/vst3sdk" \
            -DOP_BUILD_AU=OFF -DOP_BUILD_AAX=OFF \
            -DOP_PRODUCT="Example Gain" -DOP_BUNDLE_ID=com.opengrid.example \
            -DOP_VERSION=0.3.1 -DOP_MANUFACTURER=OpenGrid \
            -DOP_TAIL=ON -DOP_EDITOR=OFF
      - name: Build the VST3 shell and its proofs
        working-directory: OpenPluginSDK
        run: cmake --build build-shell -j 2
      # Runs vst3_proof, vst3_noalloc_proof, vst3_bypass_latency_proof and
      # vst3_noalloc_latency_proof. vst3_editor_proof needs -DOP_EDITOR=ON and a
      # window server, so it is not run here.
      - name: Run the VST3 proofs
        working-directory: OpenPluginSDK
        run: ctest --test-dir build-shell --output-on-failure

  audio-unit:
    name: Audio Unit shell proofs
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Check out OpenPluginSDK
        uses: actions/checkout@v4
        with:
          path: OpenPluginSDK
      # Pinned like GoodLookinDri below.
      - name: Check out GoodLookinDri as a sibling
        uses: actions/checkout@v4
        with:
          repository: MistaMin/GoodLookinDri
          ref: ${{ env.GOODLOOKINDRI_REF }}
          path: GoodLookinDri
      # Apple's public AudioUnitSDK (Apache-2.0), tag AudioUnitSDK-1.4.0. The
      # Audio Unit shell compiles against its sources; nothing is installed.
      - name: Check out AudioUnitSDK
        uses: actions/checkout@v4
        with:
          repository: apple/AudioUnitSDK
          ref: ${{ env.AUDIOUNITSDK_REF }}
          path: AudioUnitSDK
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      # au_roles_proof links Role Tags (examples/role_tags), found next to the example.
      - name: Build the example plugin and Role Tags as static libraries
        working-directory: OpenPluginSDK
        run: cargo build --release --lib -p example-editor -p example-role-tags
      - name: Configure the Audio Unit shell only
        working-directory: OpenPluginSDK
        run: >
          cmake -S native -B build-shell -DCMAKE_BUILD_TYPE=Release
          -DOP_RUST_LIB="$PWD/target/release/libexample_editor.a"
          -DOP_BUILD_VST3=OFF -DOP_BUILD_AAX=OFF
          -DOP_AU_SDK="$GITHUB_WORKSPACE/AudioUnitSDK"
          -DOP_PRODUCT="Example Gain" -DOP_BUNDLE_ID=com.opengrid.example
          -DOP_VERSION=0.3.1 -DOP_MANUFACTURER=OpenGrid
          -DOP_AU_SUBTYPE=ExGn -DOP_AU_MANUFACTURER=OpGd
          -DOP_TAIL=ON -DOP_EDITOR=OFF
      - name: Build the shell and the proofs
        working-directory: OpenPluginSDK
        run: cmake --build build-shell -j 2
      - name: Run the Audio Unit proofs
        working-directory: OpenPluginSDK
        run: ctest --test-dir build-shell -R '^au_' --output-on-failure

  # One sound in every format (docs/FORMAT_PARITY.md): the example rendered
  # through CLAP, LV2, VST3 and the Audio Unit must equal the Rust plugin
  # called directly, sample for sample, and the deliberately altered shells
  # must fail. AAX is not here: its SDK is not redistributable, so it runs
  # locally with AAX_SDK set. Nothing is installed; bundles load by path.
  format-parity:
    name: Format parity (CLAP, LV2, VST3, Audio Unit)
    runs-on: macos-latest
    timeout-minutes: 50
    env:
      # VST3 SDK v3.8.0_build_66, as in the vst3-shell job.
      VST3_SDK_REF: v3.8.0_build_66
    steps:
      - name: Check out OpenPluginSDK
        uses: actions/checkout@v4
        with:
          path: OpenPluginSDK
      - name: Check out GoodLookinDri as a sibling
        uses: actions/checkout@v4
        with:
          repository: MistaMin/GoodLookinDri
          ref: ${{ env.GOODLOOKINDRI_REF }}
          path: GoodLookinDri
      - name: Check out the public VST3 SDK
        uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          ref: ${{ env.VST3_SDK_REF }}
          submodules: recursive
          path: vst3sdk
      - name: Check out AudioUnitSDK
        uses: actions/checkout@v4
        with:
          repository: apple/AudioUnitSDK
          ref: ${{ env.AUDIOUNITSDK_REF }}
          path: AudioUnitSDK
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run the format parity test
        working-directory: OpenPluginSDK
        env:
          VST3_SDK: ${{ github.workspace }}/vst3sdk
          AU_SDK: ${{ github.workspace }}/AudioUnitSDK
        run: scripts/format_parity/run.sh --work "$RUNNER_TEMP/format-parity"

  # Universal binaries, proven (docs/BUILD.md). build_plugin.sh --archs universal
  # builds CLAP, LV2, VST3 and the Audio Unit as two-slice bundles and checks
  # `lipo -archs` on each binary. Then the x86_64 slice runs under Rosetta on
  # the arm64 runner: the VST3 and Audio Unit proofs, the format parity test and
  # clap-validator (built for x86_64). The arm64 slice runs the same proofs
  # natively. AAX is not here: its SDK is not redistributable, so it is proven
  # locally. Nothing is installed in a plug-in folder.
  universal:
    name: Universal binaries (arm64 and x86_64 under Rosetta)
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      VST3_SDK_REF: v3.8.0_build_66
      # clap-validator 0.4.1 (build 127-g152b982), built from this commit
      # because the release zip holds an arm64 binary only.
      CLAP_VALIDATOR_REV: 152b9823e992d782c5c1fd33bca0295478b919aa
    steps:
      - name: Check out OpenPluginSDK
        uses: actions/checkout@v4
        with:
          path: OpenPluginSDK
      - name: Check out GoodLookinDri as a sibling
        uses: actions/checkout@v4
        with:
          repository: MistaMin/GoodLookinDri
          ref: ${{ env.GOODLOOKINDRI_REF }}
          path: GoodLookinDri
      - name: Check out the public VST3 SDK
        uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          ref: ${{ env.VST3_SDK_REF }}
          submodules: recursive
          path: vst3sdk
      - name: Check out AudioUnitSDK
        uses: actions/checkout@v4
        with:
          repository: apple/AudioUnitSDK
          ref: ${{ env.AUDIOUNITSDK_REF }}
          path: AudioUnitSDK
      - name: Install stable Rust with both Apple targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      # Rosetta is already on GitHub's arm64 runners; this installs it only if
      # it is missing, and fails the job if x86_64 code still cannot run.
      - name: Make sure Rosetta runs x86_64 code
        run: |
          set -euo pipefail
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true
          echo "Rosetta: $(arch -x86_64 uname -m)"
      - name: Build every available format as a universal bundle
        working-directory: OpenPluginSDK
        run: |
          set -euo pipefail
          scripts/build_plugin.sh \
            --manifest-path examples/editor/Cargo.toml --version 0.3.1 \
            --name "Example Gain" --bundle-id com.opengrid.example --manufacturer OpenGrid \
            --au-subtype ExGn --au-manufacturer OpGd \
            --ttl-bin lv2_ttl --formats clap,lv2,vst3,au --editor --tail \
            --archs universal --jobs 3 \
            --vst3-sdk "$GITHUB_WORKSPACE/vst3sdk" --au-sdk "$GITHUB_WORKSPACE/AudioUnitSDK" \
            --out "$RUNNER_TEMP/universal-dist" --work-dir "$RUNNER_TEMP/universal-work"
      # The script already compares each binary with the requested slices;
      # this is the same check, written out, so a regression in the script
      # cannot hide it.
      - name: Both slices in every bundle binary
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/universal-dist"
          for f in "$d/Example Gain.clap/Contents/MacOS/Example Gain" \
                   "$d/ExampleGain.lv2/ExampleGain.dylib" \
                   "$d/Example Gain.vst3/Contents/MacOS/Example Gain" \
                   "$d/Example Gain.component/Contents/MacOS/Example Gain"; do
            archs="$(lipo -archs "$f" | tr ' ' '\n' | sort | tr '\n' ' ')"
            echo "$archs: $f"
            test "$archs" = "arm64 x86_64 "
          done
      # The shells and proofs, again as universal binaries (the proofs are not
      # part of the bundle build). No editor, so the stand-in plugins build too.
      - name: Build the shells and proofs as universal binaries
        run: |
          set -euo pipefail
          cmake -S OpenPluginSDK/native -B "$RUNNER_TEMP/universal-proofs" -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DOP_RUST_LIB="$RUNNER_TEMP/universal-work/universal/libexample_editor.a" \
            -DOP_VST3_SDK="$GITHUB_WORKSPACE/vst3sdk" -DOP_AU_SDK="$GITHUB_WORKSPACE/AudioUnitSDK" \
            -DOP_BUILD_AAX=OFF \
            -DOP_PRODUCT="Example Gain" -DOP_BUNDLE_ID=com.opengrid.example \
            -DOP_VERSION=0.3.1 -DOP_MANUFACTURER=OpenGrid \
            -DOP_AU_SUBTYPE=ExGn -DOP_AU_MANUFACTURER=OpGd \
            -DOP_TAIL=ON -DOP_EDITOR=OFF
          cmake --build "$RUNNER_TEMP/universal-proofs" -j 3
      - name: Run the proofs, arm64 slice
        run: ctest --test-dir "$RUNNER_TEMP/universal-proofs" --output-on-failure
      # CMAKE_TEST_LAUNCHER puts `arch -x86_64` in front of every test
      # command. Changing it only rewrites the test list; nothing rebuilds.
      - name: Run the proofs, x86_64 slice under Rosetta
        run: |
          set -euo pipefail
          cmake -S OpenPluginSDK/native -B "$RUNNER_TEMP/universal-proofs" "-DCMAKE_TEST_LAUNCHER=arch;-x86_64"
          ctest --test-dir "$RUNNER_TEMP/universal-proofs" --output-on-failure
      - name: Build clap-validator for x86_64 and arm64
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/cv-target"
          for t in x86_64-apple-darwin aarch64-apple-darwin; do
            cargo install --git https://github.com/free-audio/clap-validator --rev "$CLAP_VALIDATOR_REV" \
              --locked --target "$t" --root "$RUNNER_TEMP/cv-$t" clap-validator
          done
          file "$RUNNER_TEMP"/cv-*/bin/clap-validator
      - name: Validate the universal CLAP bundle, both slices
        run: |
          set -euo pipefail
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            echo "== clap-validator $t"
            "$RUNNER_TEMP/cv-$t/bin/clap-validator" validate "$RUNNER_TEMP/universal-dist/Example Gain.clap"
          done
      - name: Format parity, x86_64 under Rosetta
        working-directory: OpenPluginSDK
        env:
          VST3_SDK: ${{ github.workspace }}/vst3sdk
          AU_SDK: ${{ github.workspace }}/AudioUnitSDK
        run: scripts/format_parity/run.sh --arch x86_64 --work "$RUNNER_TEMP/format-parity-x86_64"

  # Third-party validators against the example. The Audio Unit is installed
  # into the runner's own Components folder, which only a CI runner may do.
  shell-validators:
    name: auval and pluginval (VST3 and Audio Unit shells)
    runs-on: macos-latest
    timeout-minutes: 50
    env:
      # VST3 SDK v3.8.0_build_66, as in the vst3-shell job.
      VST3_SDK_REF: v3.8.0_build_66
      # pluginval 1.0.4, the latest release that is not a prerelease. The
      # checksum is the SHA-256 of pluginval_macOS.zip, computed from the
      # download itself; the release page publishes none for 1.0.4.
      PLUGINVAL_URL: https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
      PLUGINVAL_SHA256: 3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f
    steps:
      - name: Check out OpenPluginSDK
        uses: actions/checkout@v4
        with:
          path: OpenPluginSDK
      # Pinned like GoodLookinDri in the other jobs.
      - name: Check out GoodLookinDri as a sibling
        uses: actions/checkout@v4
        with:
          repository: MistaMin/GoodLookinDri
          ref: ${{ env.GOODLOOKINDRI_REF }}
          path: GoodLookinDri
      - name: Check out the public VST3 SDK
        uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          ref: ${{ env.VST3_SDK_REF }}
          submodules: recursive
          path: vst3sdk
      - name: Check out AudioUnitSDK
        uses: actions/checkout@v4
        with:
          repository: apple/AudioUnitSDK
          ref: ${{ env.AUDIOUNITSDK_REF }}
          path: AudioUnitSDK
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      # Nothing from the download runs unless the checksum matches.
      - name: Download pluginval and verify its checksum
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pluginval"
          cd "$RUNNER_TEMP/pluginval"
          curl --fail --silent --show-error --location --output pluginval.zip "$PLUGINVAL_URL"
          echo "$PLUGINVAL_SHA256  pluginval.zip" | shasum -a 256 -c -
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --version
      - name: Build the example plugin as a static library
        working-directory: OpenPluginSDK
        run: cargo build --release --lib -p example-editor
      # VST3 and Audio Unit shells, product "Example Gain" (AU aufx ExGn OpGd).
      - name: Configure the shells
        working-directory: OpenPluginSDK
        run: >
          cmake -S native -B build-shell -DCMAKE_BUILD_TYPE=Release
          -DOP_RUST_LIB="$PWD/target/release/libexample_editor.a"
          -DOP_VST3_SDK="$GITHUB_WORKSPACE/vst3sdk"
          -DOP_AU_SDK="$GITHUB_WORKSPACE/AudioUnitSDK"
          -DOP_BUILD_AAX=OFF
          -DOP_PRODUCT="Example Gain" -DOP_BUNDLE_ID=com.opengrid.example
          -DOP_VERSION=0.3.1 -DOP_MANUFACTURER=OpenGrid
          -DOP_AU_SUBTYPE=ExGn -DOP_AU_MANUFACTURER=OpGd
          -DOP_TAIL=ON -DOP_EDITOR=OFF
      - name: Build the shells
        working-directory: OpenPluginSDK
        run: cmake --build build-shell -j 2
      # The build folder also holds test stand-ins (LatencyTest.component,
      # Latency Stub.vst3). Only "Example Gain" is installed.
      - name: Install the Audio Unit on the runner
        working-directory: OpenPluginSDK
        run: |
          set -euo pipefail
          dir="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$dir"
          rm -rf "$dir/Example Gain.component"
          ditto "build-shell/Example Gain.component" "$dir/Example Gain.component"
          codesign --verify --verbose "$dir/Example Gain.component"
          # Make the system notice the new component, then wait until the
          # registry lists it (aufx ExGn OpGd).
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          for i in $(seq 1 30); do
            if auval -a | grep -q 'aufx ExGn OpGd'; then
              echo "registered after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Example Gain was not registered within 30 s" >&2
          auval -a >&2 || true
          exit 1
      # auval exits non-zero on a failed test. The log is also searched, so a
      # run that prints a failure never passes on the exit code alone.
      - name: auval
        run: |
          set -euo pipefail
          auval -v aufx ExGn OpGd 2>&1 | tee "$RUNNER_TEMP/auval.log"
          grep -q 'AU VALIDATION SUCCEEDED' "$RUNNER_TEMP/auval.log"
          if grep -q 'FAIL' "$RUNNER_TEMP/auval.log"; then exit 1; fi
      - name: auval -strict
        run: |
          set -euo pipefail
          auval -strict -v aufx ExGn OpGd 2>&1 | tee "$RUNNER_TEMP/auval-strict.log"
          grep -q 'AU VALIDATION SUCCEEDED' "$RUNNER_TEMP/auval-strict.log"
          if grep -q 'FAIL' "$RUNNER_TEMP/auval-strict.log"; then exit 1; fi
      # Strictness 10 is pluginval's maximum (it adds the long process, fuzz
      # and multi-rate, multi-block-size runs on top of the host-compatibility
      # level 5). The example passes it as a VST3 bundle, so nothing lower is
      # worth asserting. --skip-gui-tests: the runner has no display and the
      # shells here are built without an editor. pluginval exits non-zero when
      # any test fails.
      - name: pluginval on the VST3 bundle
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/pluginval/pluginval.app/Contents/MacOS/pluginval" \
            --strictness-level 10 --skip-gui-tests \
            --output-dir "$RUNNER_TEMP/pluginval-vst3" \
            "OpenPluginSDK/build-shell/Example Gain.vst3"
      # An Audio Unit is found through the installed component.
      - name: pluginval on the Audio Unit
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/pluginval/pluginval.app/Contents/MacOS/pluginval" \
            --strictness-level 10 --skip-gui-tests \
            --output-dir "$RUNNER_TEMP/pluginval-au" \
            "$HOME/Library/Audio/Plug-Ins/Components/Example Gain.component"
      - name: Keep the validator logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validator-logs
          path: |
            ${{ runner.temp }}/pluginval-vst3
            ${{ runner.temp }}/pluginval-au
            ${{ runner.temp }}/auval.log
            ${{ runner.temp }}/auval-strict.log
          if-no-files-found: ignore

  lv2-validate:
    name: lv2_validate and lv2apply (examples/editor)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out OpenPluginSDK
        uses: actions/checkout@v4
        with:
          path: OpenPluginSDK
      - name: Check out GoodLookinDri as a sibling
        uses: actions/checkout@v4
        with:
          repository: MistaMin/GoodLookinDri
          ref: ${{ env.GOODLOOKINDRI_REF }}
          path: GoodLookinDri
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      # lv2 has lv2_validate and the specifications; lilv has lv2apply, lv2ls
      # and the library a host loads plug-ins with.
      - name: Install the LV2 tools
        run: |
          set -euo pipefail
          brew install lv2 lilv
          command -v lv2_validate lv2apply lv2ls
      - name: Build the example and its LV2 description writer
        working-directory: OpenPluginSDK
        run: cargo build --release -p example-editor --lib --bin lv2_ttl
      - name: Assemble the LV2 bundle
        working-directory: OpenPluginSDK
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/lv2/example_editor.lv2"
          rm -rf "$RUNNER_TEMP/lv2"
          mkdir -p "$bundle"
          cp target/release/libexample_editor.dylib "$bundle/"
          target/release/lv2_ttl "$bundle" libexample_editor
          ls -l "$bundle"
      # lv2_validate takes the TTL files by name, so it runs inside the bundle.
      # It skips a file it cannot open and still prints "0 errors", so a
      # skipped bundle file fails the step too.
      - name: lv2_validate
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/lv2/example_editor.lv2"
          lv2_validate manifest.ttl libexample_editor.ttl 2>&1 | tee "$RUNNER_TEMP/lv2_validate.log"
          grep -q '^Found 0 errors' "$RUNNER_TEMP/lv2_validate.log"
          if grep -Eq '^error|Skipping file .*example_editor' "$RUNNER_TEMP/lv2_validate.log"; then exit 1; fi
      # Loads the dylib through lilv, instantiates the plugin and runs it. Gain
      # +6 dB must roughly double a sine, which shows the audio went through.
      - name: lv2apply
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lv2-audio"
          cd "$RUNNER_TEMP/lv2-audio"
          python3 -I - <<'PY'
          import math, struct, wave
          w = wave.open("in.wav", "wb")
          w.setnchannels(2); w.setsampwidth(2); w.setframerate(48000)
          w.writeframes(b"".join(struct.pack("<hh", *(int(8000 * math.sin(i * 0.05)),) * 2) for i in range(4800)))
          w.close()
          PY
          export LV2_PATH="$RUNNER_TEMP/lv2"
          uri="$(lv2ls | grep 'examples/editor-gain$')"
          test -n "$uri"
          echo "plugin: $uri"
          lv2apply -i in.wav -o out.wav -c gain 6 "$uri"
          python3 -I - <<'PY'
          import struct, wave
          def peak(name):
              w = wave.open(name)
              frames = w.getnframes()
              data = struct.unpack("<%dh" % (frames * w.getnchannels()), w.readframes(frames))
              return frames, max(abs(s) for s in data)
          frames_in, peak_in = peak("in.wav")
          frames_out, peak_out = peak("out.wav")
          print("in", frames_in, peak_in, "out", frames_out, peak_out)
          assert frames_out == frames_in, "frame count changed"
          assert 1.9 * peak_in <= peak_out <= 2.1 * peak_in, "+6 dB did not double the peak"
          PY
