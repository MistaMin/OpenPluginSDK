[package]
name = "example-editor"
description = "A gain plugin with an editor in every format: CLAP, LV2, VST3, Audio Unit and AAX"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
openplugin = { workspace = true }

[build-dependencies]
openplugin-core = { workspace = true }

# Runs on the main thread, which AppKit needs.
[[test]]
name = "cocoa"
harness = false

[[test]]
name = "a11y"
harness = false

[[test]]
name = "typing"
harness = false

[[test]]
name = "menu"
harness = false

# The editor in real HWNDs (Windows; a stub elsewhere). One thread pumps the messages.
[[test]]
name = "win32"
harness = false

# The editor through CLAP and LV2 on a real X display (Linux); one thread, as the view needs.
[[test]]
name = "x11"
harness = false

# The test's own X connection: it plays the host.
[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "0.13", default-features = false }
