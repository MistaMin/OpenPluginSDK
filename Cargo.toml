[workspace]
members = [
    "crates/openplugin-core",
    "crates/openplugin-dsp",
    "crates/openplugin-dri",
    "crates/openplugin-targets",
    "crates/openplugin-ffi",
    "crates/openplugin",
    "examples/gain",
    "examples/console_eq",
    "examples/editor",
    "examples/design_editor",
]
resolver = "2"

[workspace.package]
version = "0.3.1-beta"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MistaMin/OpenPluginSDK"
homepage = "https://github.com/MistaMin/OpenPluginSDK#readme"
authors = ["Marcos Quirino Deida", "OpenPluginSDK Contributors"]
keywords = ["audio", "plugin", "vst3", "clap", "aax"]
categories = ["multimedia::audio", "gui"]

[workspace.dependencies]
openplugin-core = { path = "crates/openplugin-core", version = "0.3.1-beta" }
openplugin-dsp = { path = "crates/openplugin-dsp", version = "0.3.1-beta" }
openplugin-dri = { path = "crates/openplugin-dri", version = "0.3.1-beta" }
openplugin-targets = { path = "crates/openplugin-targets", version = "0.3.1-beta" }
openplugin-ffi = { path = "crates/openplugin-ffi", version = "0.3.1-beta" }
openplugin = { path = "crates/openplugin", version = "0.3.1-beta" }
goodlookindri = { path = "../GoodLookinDri", version = "0.2.0" }
goodlookindri-shell = { path = "../GoodLookinDri/shell", version = "0.2.0" }

serde = { version = "1.0", features = ["derive"] }
log = "0.4"
rustfft = "6.2"
raw-window-handle = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
