[workspace]
members = [
    "crates/openplugin-core",
    "crates/openplugin-dsp",
    "crates/openplugin-dri",
    "crates/openplugin-targets",
    "crates/openplugin",
    "examples/gain",
    "examples/console_eq",
]
resolver = "2"

[workspace.package]
version = "0.1.0-beta.1"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MistaMin/OpenPluginSDK"
homepage = "https://github.com/MistaMin/OpenPluginSDK"
authors = ["MistaMin", "OpenPluginSDK Contributors"]
keywords = ["audio", "plugin", "vst3", "clap", "aax"]
categories = ["multimedia::audio", "gui"]

[workspace.dependencies]
openplugin-core = { path = "crates/openplugin-core", version = "0.1.0-beta.1" }
openplugin-dsp = { path = "crates/openplugin-dsp", version = "0.1.0-beta.1" }
openplugin-dri = { path = "crates/openplugin-dri", version = "0.1.0-beta.1" }
openplugin-targets = { path = "crates/openplugin-targets", version = "0.1.0-beta.1" }
openplugin = { path = "crates/openplugin", version = "0.1.0-beta.1" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
rustfft = "6.2"
raw-window-handle = "0.6"
cpal = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
