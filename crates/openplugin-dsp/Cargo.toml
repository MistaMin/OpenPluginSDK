[package]
name = "openplugin-dsp"
description = "Textbook, realtime-safe DSP building blocks (filters, dynamics, reverbs, delays, saturation, meters)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/openplugin-dsp"
readme = "README.md"
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
openplugin-core = { workspace = true }
rustfft = { workspace = true }
serde_json = "1"

[dev-dependencies]
openplugin-testing = { workspace = true }

[package.metadata.docs.rs]
# No cargo features. The SIMD paths differ by architecture, so docs.rs builds each target.
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
