[package]
name = "openplugin"
description = "Universal, zero-allocation audio plugin development framework with GoodLookin DRI (CLAP, LV2, VST3, AU, AAX)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/openplugin"
readme = "README.md"
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
openplugin-core = { workspace = true }
openplugin-dsp = { workspace = true }
openplugin-dri = { workspace = true }
openplugin-targets = { workspace = true }
openplugin-host = { workspace = true }
openplugin-testing = { workspace = true, optional = true }

[features]
# Re-exports the conformance kit and benchmark harness as `openplugin::testing`.
testing = ["dep:openplugin-testing"]

[package.metadata.docs.rs]
# The `testing` feature re-exports openplugin-testing as `openplugin::testing`.
all-features = true
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
