[package]
name = "openplugin"
description = "Universal, zero-allocation audio plugin development framework with GoodLookin DRI (CLAP, VST3, AU, AAX, Standalone)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/openplugin"
readme = "README.md"
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
openplugin-core = { workspace = true }
openplugin-dsp = { workspace = true }
openplugin-dri = { workspace = true }
openplugin-targets = { workspace = true }
openplugin-ffi = { workspace = true }
openplugin-testing = { workspace = true, optional = true }

[features]
# Re-exports the conformance kit and benchmark harness as `openplugin::testing`.
testing = ["dep:openplugin-testing"]
