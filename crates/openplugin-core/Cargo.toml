[package]
name = "openplugin-core"
description = "Core plugin traits, parameter metadata, transport, and event interfaces for OpenPluginSDK"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/openplugin-core"
readme = "README.md"
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
serde = { workspace = true }

[dev-dependencies]
serde_json = "1"
# Turns the `automation` feature on for this crate's own tests.
openplugin-core = { path = ".", features = ["automation"] }

[features]
# Host-side automation lanes (the `automation` module). Not used by any bridge
# or plugin, and outside the API promise of 1.0.
automation = []
