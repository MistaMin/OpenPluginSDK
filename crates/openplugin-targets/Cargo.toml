[package]
name = "openplugin-targets"
description = "Format entries for OpenPluginSDK: CLAP and LV2 in Rust, and the C ABI for the VST3, Audio Unit and AAX shells"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/openplugin-targets"
readme = "README.md"
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
openplugin-core = { workspace = true }
openplugin-host = { workspace = true }

# The Cocoa editor view is the only user of the DRI shell.
[target.'cfg(target_os = "macos")'.dependencies]
openplugin-dri = { workspace = true }

# The X11 editor view.
[target.'cfg(target_os = "linux")'.dependencies]
openplugin-dri = { workspace = true }

# The Win32 editor view.
[target.'cfg(windows)'.dependencies]
openplugin-dri = { workspace = true }

[dev-dependencies]
openplugin-dsp = { workspace = true }
openplugin-testing = { workspace = true }

# The crate has no features. The editor entries differ per system, so docs.rs
# builds one page set for each.
[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
