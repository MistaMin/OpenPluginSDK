[package]
name = "openplugin-targets"
description = "Export targets and format bridges for OpenPluginSDK: CLAP, VST3, AU, AAX, Standalone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/openplugin-targets"
readme = "README.md"
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
openplugin-core = { workspace = true }
openplugin-dri = { workspace = true }
openplugin-ffi = { workspace = true }
log = { workspace = true }

[dev-dependencies]
openplugin-dsp = { workspace = true }

[features]
default = ["clap", "vst3", "au", "aax", "standalone"]
clap = []
vst3 = []
au = []
aax = []
# No device I/O yet: the runner has no audio backend, so the feature gates no extra dependency.
standalone = []
