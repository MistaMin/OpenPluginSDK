[package]
name = "openplugin-dri"
description = "GoodLookin Design Rust Interface (DRI) - Pure procedural hardware UI engine without JUCE"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/openplugin-dri"
readme = "README.md"
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
openplugin-core = { workspace = true }
goodlookindri = { workspace = true }
goodlookindri-shell = { workspace = true }
log = { workspace = true }

# The X11 editor view (x11/): the protocol in pure Rust, no libxcb or libX11.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", default-features = false }
rustix = { version = "1", default-features = false, features = ["event", "std"] }

# The editor views are per platform (cocoa on macOS, win32 on Windows, x11 on Linux),
# so docs.rs builds each of the three. The crate has no features.
[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
